# Keyless deploys to Firebase / Google Cloud (Workload Identity Federation, no stored keys).
#   pull_request  → Hosting preview channel only, on the fund-tracer site (service account: github-preview)
#   push to main  → Hosting (both sites: fund-tracer.web.app and finrakshak-ai.web.app, the same build)
#                   + Functions + Firestore rules/indexes (service account: github-deployer,
#                   which Google only lets runs on refs/heads/main use)
#                   then, once INGEST_ENABLED=true, the cloud ingestion image, jobs and workflow
# One-time GCP setup: scripts/setup-gcp.sh (+ scripts/setup-ingest-gcp.sh). The defaults below match; override them with
# repo variables (Settings → Secrets and variables → Actions → Variables) only if you change it:
#   FIREBASE_PROJECT_ID, WIF_PROVIDER, PREVIEW_SA, DEPLOY_SA,
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_APP_ID, VITE_RECAPTCHA_SITE_KEY
#   (public web config; the reCAPTCHA key ID is what App Check needs)
# Hosting sites are Hosting targets in .firebaserc, recorded for the project fund-tracer only: a
# different FIREBASE_PROJECT_ID needs its own `firebase target:apply hosting …` entries (docs/DEPLOY.md).
# Cost: docs-only changes skip deploys, and a newer push cancels a superseded preview run.
name: Deploy
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a production deploy half-way; previews are safe to supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'fund-tracer' }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER || 'projects/728958349363/locations/global/workloadIdentityPools/github/providers/github-oidc' }}
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
  # Set to false to hide "Try demo" on the live site; anything else (or unset) keeps it.
  VITE_ENABLE_DEMO: ${{ vars.VITE_ENABLE_DEMO }}
jobs:
  preview:
    # Fork PRs get no OIDC token; CI covers them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Ship the public-records bundle with Hosting (/graph-lab/, git-ignored, built from the committed
      # data/processed). Fallback until the cloud /data/** feed is live; it is NOT behind sign-in (B-46).
      - name: Publish public-records bundle for Hosting
        run: |
          npm run build -w @finrakshak-ai/shared && npm run build -w ingest
          node ingest/dist/graphCli.js --web
      # Lint, types and tests already run in ci.yml for every PR; only build here.
      - run: npm run build -w @finrakshak-ai/shared && npm run build -w web
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_SA || format('github-preview@{0}.iam.gserviceaccount.com', env.FIREBASE_PROJECT_ID) }}
      # Both sites serve the same build and config (firebase.json), so one preview is enough.
      - name: Deploy preview channel
        run: |
          npx firebase hosting:channel:deploy "pr-${{ github.event.number }}" --only fund-tracer \
            --project "$FIREBASE_PROJECT_ID" --expires 7d --json > channel.json
          url=$(jq -r '.result[]?.url // empty' channel.json | head -1)
          echo "### Preview: ${url:-see deploy log}" >> "$GITHUB_STEP_SUMMARY"

  live:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Re-check on main so a broken merge can never reach production.
      - run: npm run check
      # Ship the public-records bundle with Hosting (/graph-lab/, git-ignored, built from the committed
      # data/processed). Fallback until the cloud /data/** feed is live; it is NOT behind sign-in (B-46).
      - name: Publish public-records bundle for Hosting
        run: |
          npm run build -w @finrakshak-ai/shared && npm run build -w ingest
          node ingest/dist/graphCli.js --web
      - run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA || format('github-deployer@{0}.iam.gserviceaccount.com', env.FIREBASE_PROJECT_ID) }}
      # No --force: a function removed from the code is reported, never silently deleted.
      # `hosting` deploys every Hosting target in firebase.json: fund-tracer and finrakshak-ai.
      - name: Deploy Hosting, Functions and Firestore
        run: npx firebase deploy --only hosting,functions,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Summary
        run: |
          echo "### Live: https://fund-tracer.web.app and https://finrakshak-ai.web.app" >> "$GITHUB_STEP_SUMMARY"

  ingest:
    # Cloud ingestion jobs + workflow (docs/DEPLOY.md → "Cloud ingestion"). Off until the one-time
    # setup has run: then set repo variable INGEST_ENABLED=true. INGEST_PUBLISH_ENABLED=true ends
    # the dry run and lets builds publish for the app.
    needs: live
    if: needs.live.result == 'success' && vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      REGION: asia-south1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA || format('github-deployer@{0}.iam.gserviceaccount.com', env.FIREBASE_PROJECT_ID) }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the ingest image (tag = commit)
        run: |
          image="$REGION-docker.pkg.dev/$FIREBASE_PROJECT_ID/ingest/ingest:${GITHUB_SHA}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f ingest/Dockerfile -t "$image" .
          docker push "$image"
      - name: Deploy jobs and workflow
        env:
          PUBLISH_ENABLED: ${{ vars.INGEST_PUBLISH_ENABLED || 'false' }}
          # Kill switch for the agent's model calls (reviews fall back to the templated text).
          AGENT_ENABLED: ${{ vars.INGEST_AGENT_ENABLED || 'true' }}
          # AI evidence extraction (shadow mode) stays off until the owner turns it on.
          AI_EXTRACT_ENABLED: ${{ vars.INGEST_AI_EXTRACT_ENABLED || 'false' }}
          # Synthetic risk scoring stays off until the owner's dry run (REMAINING_WORK.md, W2g).
          SCORE_ENABLED: ${{ vars.INGEST_SCORE_ENABLED || 'false' }}
          # Pattern miner and risk explainer stay off until the budget alert and a dry run (B-15).
          MINER_ENABLED: ${{ vars.INGEST_MINER_ENABLED || 'false' }}
          EXPLAIN_ENABLED: ${{ vars.INGEST_EXPLAIN_ENABLED || 'false' }}
        run: scripts/deploy-ingest.sh "$FIREBASE_PROJECT_ID" "$IMAGE" "$REGION"
