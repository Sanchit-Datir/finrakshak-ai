# Keyless deploys to Firebase / Google Cloud (Workload Identity Federation, no stored keys).
#   pull_request  → Hosting preview channel only (service account: github-preview)
#   push to main  → Hosting + Functions + Firestore rules/indexes (service account: github-deployer,
#                   which Google only lets runs on refs/heads/main use)
# One-time GCP setup: scripts/setup-gcp.sh. The defaults below match that setup; override them with
# repo variables (Settings → Secrets and variables → Actions → Variables) only if you change it:
#   FIREBASE_PROJECT_ID, WIF_PROVIDER, PREVIEW_SA, DEPLOY_SA,
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_APP_ID (public web config)
# Cost: docs-only changes skip deploys, and a newer push cancels a superseded preview run.
name: Deploy
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a production deploy half-way; previews are safe to supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'fund-tracer' }}
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER || 'projects/728958349363/locations/global/workloadIdentityPools/github/providers/github-oidc' }}
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
jobs:
  preview:
    # Fork PRs get no OIDC token; CI covers them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint, types and tests already run in ci.yml for every PR; only build here.
      - run: npm run build -w @fund-tracker/shared && npm run build -w web
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_SA || format('github-preview@{0}.iam.gserviceaccount.com', env.FIREBASE_PROJECT_ID) }}
      - name: Deploy preview channel
        run: |
          npx firebase hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "$FIREBASE_PROJECT_ID" --expires 7d --json > channel.json
          url=$(jq -r '.result[]?.url // empty' channel.json | head -1)
          echo "### Preview: ${url:-see deploy log}" >> "$GITHUB_STEP_SUMMARY"

  live:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Re-check on main so a broken merge can never reach production.
      - run: npm run check
      - run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA || format('github-deployer@{0}.iam.gserviceaccount.com', env.FIREBASE_PROJECT_ID) }}
      # No --force: a function removed from the code is reported, never silently deleted.
      - name: Deploy Hosting, Functions and Firestore
        run: npx firebase deploy --only hosting,functions,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive
