name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # SCA: fail on any known vulnerability in production dependencies (see SECURITY.md).
      - run: npm run audit:prod
      - run: npm run check
      - run: npm run build
