# Daily cloud ingestion run (docs/plans/GCP_INGESTION_AGENT_PLAN.md §7).
# Started by Cloud Scheduler `ingest-daily`; deployed by scripts/deploy-ingest.sh.
# Each step is a Cloud Run job of the same image. A failing step is recorded and the remaining
# steps still run (the build always records the run); the execution then fails so alerting fires.
# Optional input: {"force_build": "true"} rebuilds and republishes even when nothing changed.
main:
  params: [input]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - runAt: ${time.format(sys.now())}
          - runId: ${"run_" + text.replace_all_regex(runAt, "[:.]", "-")}
          - forceBuild: ${if(input == null, "false", string(default(map.get(input, "force_build"), false)))}
          - failed: []
    - acquire:
        try:
          call: run_job
          args:
            project: ${project}
            region: ${region}
            job: ingest-acquire
            env:
              - name: FUNDTRACE_RUN_ID
                value: ${runId}
              - name: FUNDTRACE_RUN_AT
                value: ${runAt}
            timeout: 25200
        except:
          as: e
          steps:
            - noteAcquire:
                assign:
                  - failed: ${list.concat(failed, "acquire")}
    - build:
        try:
          call: run_job
          args:
            project: ${project}
            region: ${region}
            job: ingest-build
            env:
              - name: FUNDTRACE_RUN_ID
                value: ${runId}
              - name: FUNDTRACE_RUN_AT
                value: ${runAt}
              - name: FUNDTRACE_FORCE_BUILD
                value: ${forceBuild}
            timeout: 7200
        except:
          as: e
          steps:
            - noteBuild:
                assign:
                  - failed: ${list.concat(failed, "build")}
    - finish:
        switch:
          - condition: ${len(failed) > 0}
            raise:
              message: ${"Run " + runId + " needs attention; failed steps recorded in ingestRuns/" + runId}
              failed_steps: ${failed}
    - done:
        return:
          run_id: ${runId}

# Runs one Cloud Run job with per-run environment overrides and waits for it to finish.
run_job:
  params: [project, region, job, env, timeout]
  steps:
    - run:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
          body:
            overrides:
              containerOverrides:
                - env: ${env}
          connector_params:
            timeout: ${timeout}
        result: execution
    - ok:
        return: ${execution}
